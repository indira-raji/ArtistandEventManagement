<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'admin/base.html' %}

{% block content %}

<h4>Admin Settings</h4>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label>Name</label>

<input type="text"
name="name"
value="{{ admin.name }}"
class="form-control">

</div>

<div class="mb-3">

<label>Change Password</label>

<input type="password"
name="password"
class="form-control">

</div>

<button class="btn btn-primary">
Update
</button>

</form>

{% endblock %}
</body>
</html>
