<!DOCTYPE html>
<html>
<head>

<title>Admin Panel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background:#f5f6fb;
font-family:Poppins;
}

/* Sidebar */
.sidebar{
height:100vh;
width:240px;
position:fixed;
background:linear-gradient(180deg,#7b2ff7,#f107a3);
color:white;
padding-top:20px;
transition:0.3s;
z-index:1000;   /* important */
}

.main{
margin-left:240px;
padding:25px;
position:relative;
z-index:1;
}

/* overlay when sidebar open */

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
display:none;
z-index:999;
}

.overlay.active{
display:block;
}


.sidebar a{
display:block;
color:white;
padding:12px 20px;
text-decoration:none;
}

.sidebar a:hover{
background:rgba(255,255,255,0.2);
}

/* Main */



/* Topbar */

.topbar{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

/* Toggle button (hidden by default) */

.toggle-btn{
font-size:22px;
cursor:pointer;
display:none;
}

/* Mobile Responsive */

@media(max-width:768px){

.sidebar{
left:-240px;
}

.sidebar.active{
left:0;
}

.main{
margin-left:0;
}

.toggle-btn{
display:block;
}

}

</style>

</head>

<body>

<div class="sidebar" id="sidebar">

<h4 class="text-center">Admin Panel</h4>

<a href="{% url 'admin-dashboard' %}"> <i class="fa fa-chart-line"></i> Dashboard</a>

<a href="{% url 'admin-artists' %}"> <i class="fa fa-music"></i> Artists</a>

<a href="{% url 'admin-events' %}"> <i class="fa fa-calendar"></i> Events</a>

<a href="{% url 'artist-history' %}"> <i class="fa fa-clock"></i> Artist Booking History</a>

<a href="{% url 'event-history' %}"> <i class="fa fa-book"></i> Event Booking History</a>

<a href="{% url 'admin-revenue' %}"> <i class="fa fa-money-bill"></i> Revenue</a>

<a href="/admin/">
<i class="fa fa-database"></i> Database
</a>

<a href="{% url 'admin-settings' %}"> <i class="fa fa-cog"></i> Settings</a>

<a href="{% url 'logout' %}"> <i class="fa fa-sign-out"></i> Logout</a>

</div>

<div class="main">

<div class="topbar">

<div>
<i class="fa fa-bars toggle-btn" onclick="toggleSidebar()"></i>
<span class="ms-2">Admin Dashboard</span>
</div>

<img src="https://i.pravatar.cc/40" class="rounded-circle">

</div>

{% block content %}
{% endblock %}

</div>

<script>

const sidebar = document.getElementById("sidebar")

function toggleSidebar(){
sidebar.classList.toggle("active")
}

/* Close when clicking outside */

document.addEventListener("click", function(event){

if(window.innerWidth <= 768){

if(!sidebar.contains(event.target) && !event.target.classList.contains("toggle-btn")){
sidebar.classList.remove("active")
}

}

})

/* Close when clicking link */

document.querySelectorAll(".sidebar a").forEach(link => {

link.addEventListener("click", () => {

if(window.innerWidth <= 768){
sidebar.classList.remove("active")
}

})

})

</script>

</body>
</html>
