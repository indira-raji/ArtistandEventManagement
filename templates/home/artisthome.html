{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist World - Home</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
  background: linear-gradient(135deg,#f3e7ff,#fdd6f0);
  font-family:'Poppins',sans-serif;
  min-height:100vh;
}

/* section */
.artist-section{
  padding:70px 0;
}

.artist-section h2{
  text-align:center;
  margin-bottom:45px;
  font-weight:700;
  color:#6b21a8;
}



.artist-card{
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(8px);
  border-radius:18px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.4);
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  transition:all .3s ease;
  margin: 10px;
  height:100%;
  display:flex;
  flex-direction:column;
}

.artist-card .card-body{
  text-align:center;
  padding:18px;

  display:flex;
  flex-direction:column;
  justify-content:space-between;
  flex-grow:1;
}
.artist-card:hover{
  transform:translateY(-8px);
  box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

/* image */
.artist-card img{
  width:100%;
  height:210px;
  object-fit:cover;
  padding:8px;
  border-radius:12px;
}

/* card body */
/* .artist-card .card-body{
  text-align:center;
  padding:18px;
} */

.artist-card h5{
  font-weight:600;
  color:#5b21b6;
  margin-bottom:12px;
}

/* button */
.artist-card .btn{
  
  background:linear-gradient(135deg,#9f7aea,#d946ef);
  border:none;
  color:white;
  padding:7px 18px;
  border-radius:20px;
  font-size:14px;
  transition:all .3s;
}

.artist-card .btn:hover{
  background:linear-gradient(135deg,#7c3aed,#c026d3);
  transform:scale(1.05);
}

</style>
</head>

<body>

<section class="artist-section container" id="Artist">

<h2>Explore Our Artists</h2>

<div class="row g-4">

{% for artist in artists %}
<div class="col-md-4 col-lg-3">

<div class="artist-card">

{% if artist.image %}
<img src="{{ artist.image.url }}" alt="{{ artist.title }}">
{% endif %}

<div class="card-body">

<h5>{{ artist.title }}</h5>

<a href="{% url 'artist_by_type' artist.query %}" class="btn">
    View Artist
</a>
</div>

</div>

</div>
{% endfor %}

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
