{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Management Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
  background: linear-gradient(135deg,#7C3AED,#EC4899);
  min-height:100vh;
  font-family:'Poppins',sans-serif;
}

/* Glass Card */
.form-card{
  max-width:900px;
  margin:40px auto;
  padding:30px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(15px);
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  color:white;
}

/* Title */
.form-title{
  text-align:center;
  font-weight:700;
  margin-bottom:25px;
}

/* Inputs */
.form-control{
  border-radius:10px;
}

/* Labels */
.form-label{
  font-weight:500;
}

/* Event Type Box */
.event-types{
  background:rgba(255,255,255,0.1);
  padding:15px;
  border-radius:15px;
}

/* Submit Button */
.btn-submit{
  background:white;
  color:#7C3AED;
  font-weight:600;
  border:none;
  padding:10px 30px;
  border-radius:10px;
  transition:.3s;
}

.btn-submit:hover{
  transform:scale(1.05);
}

</style>
</head>

<body>

<div class="container">

<div class="form-card">

<h2 class="form-title">Event Management Registration</h2>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<!-- Team Name -->
<div class="mb-3">
<label class="form-label">Team / Company Name</label>
<input type="text" name="team_name" class="form-control" required>
</div>

<!-- Owner Name -->
<div class="mb-3">
<label class="form-label">Owner / Manager Name</label>
<input type="text" name="owner_name" class="form-control" required>
</div>

<!-- Email -->
<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" name="email" class="form-control">
</div>

<!-- Phone -->
<div class="mb-3">
<label class="form-label">Phone</label>
<input type="text" name="phone" class="form-control" required>
</div>

<!-- Address -->
<div class="mb-3">
<label class="form-label">Address</label>
<textarea name="address" class="form-control" rows="2"></textarea>
</div>

<!-- City -->
<div class="mb-3">
<label class="form-label">City</label>
<input type="text" name="city" class="form-control">
</div>

<!-- Social -->
<div class="mb-3">
<label class="form-label">YouTube / Instagram Link</label>
<input type="url" name="social_link" class="form-control">
</div>

<!-- Experience -->
<div class="mb-3">
<label class="form-label">Experience (Years)</label>
<input type="number" name="experience" class="form-control">
</div>

<!-- Languages -->
<div class="mb-3">
<label class="form-label">Languages Known</label>
<input type="text" name="languages" class="form-control">
</div>

<!-- Logo -->
<div class="mb-3">
<label class="form-label">Company Logo</label>
<input type="file" name="logo" class="form-control">
</div>

<!-- Description -->
<div class="mb-3">
<label class="form-label">Company Description</label>
<textarea name="description" class="form-control" rows="3"></textarea>
</div>

<!-- Event Types -->
<div class="mb-3">

<label class="form-label">Event Types Managed</label>

<div class="event-types">

{% for event in event_types %}

<div class="form-check form-check-inline">

<input class="form-check-input"
       type="checkbox"
       name="event_types"
       value="{{ event.id }}">

<label class="form-check-label">
{{ event.title }}
</label>

</div>

{% endfor %}

</div>

</div>

<!-- Submit -->
<div class="text-center mt-4">
<button type="submit" class="btn btn-submit">
Register
</button>
</div>

</form>

</div>

</div>

</body>
</html>
