{% extends 'event/base.html' %}

{% block content %}

<h4>Portfolio</h4>

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

<input type="file" name="images" multiple class="form-control mb-3">

<button class="btn btn-light">Upload</button>

</form>

<div class="row mt-4">

{% for p in portfolio %}

<div class="col-md-4">

<div class="card-glass">

<img src="{{ p.image.url }}" class="img-fluid">

<a href="{% url 'delete_event_portfolio' p.id %}" class="btn btn-danger btn-sm mt-2">
Delete
</a>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
