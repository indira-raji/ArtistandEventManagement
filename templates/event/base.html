<!DOCTYPE html>
<html>
<head>

<title>Event Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background: linear-gradient(135deg,#6a11cb,#ff4ecd);
font-family: 'Poppins', sans-serif;
color:white;
}

.sidebar{
width:250px;
height:100vh;
position:fixed;
background: linear-gradient(180deg,#6a11cb,#ff4ecd);
padding-top:20px;
}

.sidebar a{
display:block;
padding:15px;
color:white;
text-decoration:none;
}

.sidebar a:hover{
background:rgba(255,255,255,0.2);
}

.main{
margin-left:250px;
padding:20px;
}

.card-glass{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border-radius:15px;
padding:20px;
margin-bottom:20px;
}

.booking-card{
background:rgba(255,255,255,0.15);
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

.badge-pending{background:orange;}
.badge-approved{background:green;}
.badge-reject{background:red;}

</style>

</head>

<body>

<div class="sidebar">

<h4 class="text-center">Event Manager</h4>

<a href="{% url 'event_dashboard' %}">
<i class="fa fa-home"></i> Dashboard
</a>

<a href="{% url 'event_profile' %}">
<i class="fa fa-user"></i> My Profile
</a>

<a href="{% url 'event_portfolio' %}">
<i class="fa fa-image"></i> Portfolio
</a>

<a href="{% url 'manage_events' %}">
<i class="fa fa-calendar"></i> Manage Events
</a>

<a href="{% url 'booking_requests' %}">
<i class="fa fa-envelope"></i> Booking Requests
</a>

<a href="{% url 'event-history' %}">
<i class="fa fa-history"></i> Booking History
</a>

<a href="{% url 'my_bookings' %}">
<i class="fa fa-music"></i> My Other Bookings
</a>

<a href="{% url 'event_payments' %}">
<i class="fa fa-credit-card"></i> Payments
</a>

<a href="{% url 'logout' %}">
<i class="fa fa-sign-out-alt"></i> Logout
</a>

</div>

<div class="main">

{% block content %}

{% endblock %}

</div>

</body>
</html>
