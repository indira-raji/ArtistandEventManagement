<!DOCTYPE html>
<html>
<head>

<title>User Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
}

.sidebar{
width:240px;
height:100vh;
position:fixed;
background:#020617;
padding:20px;
}

.sidebar h4{
color:#38bdf8;
}

.sidebar a{
display:block;
color:white;
text-decoration:none;
padding:12px;
margin:8px 0;
border-radius:6px;
}

.sidebar a:hover{
background:#1e293b;
}

.main{
margin-left:260px;
padding:30px;
}

.card-glass{
background:#1e293b;
padding:20px;
border-radius:10px;
}

.booking-card{
background:#1e293b;
padding:15px;
margin-bottom:15px;
border-radius:8px;
}

.badge-pending{
background:orange;
padding:6px 10px;
border-radius:5px;
}

.badge-confirm{
background:green;
padding:6px 10px;
border-radius:5px;
}

</style>

</head>

<body>

<div class="sidebar">

<h4 class="text-center mb-4">Artists World</h4>
<a href="{% url 'home' %}">
<i class="fa fa-home"></i> Home
</a>

<a href="{% url 'user-dashboard' %}">
<i class="fa fa-home"></i> Dashboard
</a>

<a href="{% url 'user-profile' %}">
<i class="fa fa-user"></i> My Profile
</a>


<a href="{% url 'user-booking-history' %}">
<i class="fa fa-history"></i> Booking History
</a>

<a href="{% url 'user-payments' %}">
<i class="fa fa-credit-card"></i> Payments
</a>

<a href="{% url 'logout' %}">
<i class="fa fa-sign-out-alt"></i> Logout
</a>

</div>

<div class="main">

{% block content %}

{% endblock %}

</div>

</body>
</html>
